<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face { font-family: 'Noto Malayalam'; font-weight: 800; src: url(/pipeline/fonts/noto-sans-malayalam-malayalam-800-normal.woff2); }
@font-face { font-family: 'Oswald'; font-weight: 700; src: url(/pipeline/fonts/oswald-latin-700-normal.woff2); }
html,body{margin:0}</style>
<script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }</script>
</head><body><script type="module">
await document.fonts.load("800 40px 'Noto Malayalam'"); await document.fonts.load("700 40px 'Oswald'");
const K = await import('/pipeline/toon3d.js'); const THREE = K.THREE; const A = await import('/pipeline/assets.js');
const Z = await import('/episodes/ml-sabarimala/sets.js');
const [q, v] = (location.search.slice(1) || 'hill').split(',');
const W = 540, H = 960; const stage = K.makeInkStage(W, H); const cam = new THREE.PerspectiveCamera(52, W / H, 0.05, 1500);
let set, p, l, gr = { focus: 40, aperture: 1.5, hazeAmt: 0.06, haze: 0xdfe9f2, sat: 1.08, contrast: 0.07, lift: 0.01, warm: 0.03, vignette: 0.3 }, tt = 2;
if (q === 'hill') { set = await Z.hillSet(stage.renderer); const T = set.TOP; p = [4, T + 4, 30]; l = [0, T + 2, 0];
  if (v === 'fire') { set.setMode('night'); set.setFire(1); p = [8, T + 7, 34]; }
  if (v === 'fireclose') { set.setMode('night'); set.setFire(1); p = [3, T + 4, 16]; l = [0, T + 4, -2]; }
  if (v === 'steps') { set.setMode('dusk'); set.setCrowd(1); p = [0, T - 3, 30]; l = [0, T + 1, 2]; }
  if (v === 'doors') { set.setMode('night'); set.setDoors(0.5); p = [0, T + 2.4, 9]; l = [0, T + 2.4, -1]; gr = { ...gr, focus: 9, aperture: 3 }; }
  if (v === 'lamps') { set.setMode('night'); set.setLamps(1); set.setCrowd(1); set.setMakara(1); p = [30, T + 30, 110]; l = [-20, T, -40]; }
  if (v === 'makara') { set.setMode('dusk'); set.setMakara(1); set.setCrowd(1); p = [4, T + 4, 12]; l = [-150, 40, -260]; }
  if (v === 'build') { set.setBuild(0.5); } if (v === 'nosh') { set.scene.traverse((o) => { if (o.isDirectionalLight) o.castShadow = false; }); } }
if (q === 'inq') { set = Z.inquirySet(); set.setBoard(1); p = [0, 2.3, 5.5]; l = [-0.5, 2.0, -2.5]; gr = { ...gr, focus: 6, aperture: 4 }; }
if (q === 'path') { set = await Z.pathSet(stage.renderer); set.setKite(true); p = [0.6, 1.6, 7]; l = [0, 1.6, -6]; gr = { ...gr, focus: 7, aperture: 4 }; }
if (q === 'mosque') { set = Z.mosqueSet(); p = [0, 2.2, 10]; l = [0, 2.6, -3]; gr = { ...gr, focus: 10, aperture: 4 }; }
if (q === 'palace') { set = Z.palaceSet(); p = [0, 2.4, 8]; l = [0, 1.8, -3]; gr = { ...gr, focus: 8, aperture: 4, warm: 0.06 }; }
if (q === 'forge') { set = Z.forgeSet(); if (v === 'pour') set.setPour(1); p = [0.5, 2.0, 4.2]; l = [-0.2, 1.1, -1.2]; gr = { ...gr, focus: 4.5, aperture: 4, warm: 0.06 }; }
await A.settle();
set.life.forEach((f) => f(tt)); cam.position.set(...p); cam.lookAt(...l); cam.updateMatrixWorld();
const cv = stage.render(set.scene, cam, gr);
window.png = cv.toDataURL('image/png'); window.done = true;
</script></body></html>
