<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face { font-family: 'Noto Malayalam'; font-weight: 800; src: url(/pipeline/fonts/noto-sans-malayalam-malayalam-800-normal.woff2); }
@font-face { font-family: 'Oswald'; font-weight: 700; src: url(/pipeline/fonts/oswald-latin-700-normal.woff2); }
html,body{margin:0}</style></head><body><canvas id=c width=2500 height=1500></canvas><script type="module">
await document.fonts.load("800 40px 'Noto Malayalam'"); await document.fonts.load("700 40px 'Oswald'");
const B = await import('/pipeline/bean.js'); (await import('/episodes/ml-vasco/cast.js')).registerCast(B);
const { drawBean, CAST, PROPS } = B;
const c = document.getElementById('c'), x = c.getContext('2d'); const g = x.createLinearGradient(0, 0, 0, 1500); g.addColorStop(0, '#3a6a8a'); g.addColorStop(0.6, '#e0a060'); g.addColorStop(1, '#5a2a1e'); x.fillStyle = g; x.fillRect(0, 0, 2500, 1500);
x.fillStyle = '#f6efe0'; x.textAlign = 'center'; x.font = "700 46px 'Oswald'"; x.fillText('CALICUT 1498: CAST', 1250, 1484);
const row1 = [['vasco', { expr: 'proud', R: 'hold', propR: PROPS.hat, L: 'hip' }], ['zamorin', { expr: 'smug', R: 'up', L: 'hip' }], ['factor', { expr: 'laugh', R: 'hold', propR: PROPS.palmLeaf, L: 'clap' }], ['wali', { expr: 'laugh', R: 'point', L: 'hip' }], ['porter', { expr: 'nervous', R: 'hold', propR: PROPS.sugarBox, L: 'hold', propL: PROPS.honeyJar }]];
const row2 = [['merchant', { expr: 'stern', R: 'point', L: 'hip' }], ['merchant2', { expr: 'sly', R: 'chin', L: 'hang' }], ['portSoldier', { expr: 'stern', R: 'hold', propR: PROPS.sword, L: 'hang' }], ['fisher', { expr: 'beam', R: 'hold', propR: PROPS.pepperSack, L: 'hang' }], ['guest', { expr: 'grin', R: 'hold', propR: PROPS.biscuit, L: 'wave' }]];
const put = (row, y) => row.forEach(([k, o], i) => { const cx = 250 + i * 500; x.fillStyle = 'rgba(255,230,190,.14)'; x.beginPath(); x.ellipse(cx, y - 260, 210, 330, 0, 0, 7); x.fill(); x.save(); x.translate(cx, y); x.scale(1.4, 1.4); drawBean(x, k, o); x.restore(); x.font = "700 30px 'Oswald'"; x.fillStyle = '#f6efe0'; x.fillText(CAST[k].name.toUpperCase(), cx, y + 46); });
put(row1, 680); put(row2, 1380);
window.png = c.toDataURL('image/png'); window.done = true;
</script></body></html>
