<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face { font-family: 'Noto Malayalam'; font-weight: 800; src: url(/pipeline/fonts/noto-sans-malayalam-malayalam-800-normal.woff2); }
@font-face { font-family: 'Noto Malayalam'; font-weight: 600; src: url(/pipeline/fonts/noto-sans-malayalam-malayalam-600-normal.woff2); }
@font-face { font-family: 'Oswald'; font-weight: 700; src: url(/pipeline/fonts/oswald-latin-700-normal.woff2); }
@font-face { font-family: 'Oswald'; font-weight: 800; src: url(/pipeline/fonts/oswald-latin-700-normal.woff2); }
html,body{margin:0;background:#000}</style>
<script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }</script>
</head><body><script type="module">
const q = new URLSearchParams(location.search);
await document.fonts.load("800 40px 'Noto Malayalam'"); await document.fonts.load("700 40px 'Oswald'");
const K = await import('/pipeline/toon3d.js'); const THREE = K.THREE; const B = await import('/pipeline/bean.js'); (await import('/episodes/ml-travancore-p2/cast.js')).registerCast(B);
const { portSet } = await import('/episodes/ml-travancore-p2/port.js');
const W = +(q.get('w') || 540), H = +(q.get('h') || 960), t = +(q.get('t') || 1.3);
const S = portSet();
const put = (who, x, z, o) => { const c = K.card(who, o); c.position.set(x, 0, z); S.scene.add(c); };
put('porter', 2, 3, { expr: 'grin', R: 'wave', propR: B.PROPS.wand }); put('captain', 3.3, 4, { expr: 'smile', R: 'wave' }); put('porter2', 0.6, 4.2, { expr: 'proud', R: 'thumb' }); put('kannan', 4.6, 3.4, { expr: 'beam', R: 'up', L: 'up' });
put('khalid', -1.2, 5, { expr: 'shock', L: 'mouth', R: 'hold', propR: B.PROPS.suitcase });
S.setLane(+(q.get('lane') || 10), t);
const cam = new THREE.PerspectiveCamera(+(q.get('fov') || 52), W / H, 0.1, 800);
const cp = (q.get('cam') || '6,1.6,10').split(',').map(Number), la = (q.get('look') || '0,6,-12').split(',').map(Number);
cam.position.set(...cp); cam.lookAt(...la); cam.rotateZ(+(q.get('roll') || 0.02));
S.life.forEach((f) => f(t));
const stage = K.makeInkStage(W, H);
stage.render(S.scene, cam, { focus: +(q.get('focus') || 6), aperture: +(q.get('ap') || 6), hazeAmt: +(q.get('haze') || 0.3), haze: 0xdfe9f2, sat: 1.1, contrast: 0.06, lift: 0.015, warm: 0.02, vignette: 0.3 });
window.png = stage.canvas.toDataURL('image/png'); window.done = true;
</script></body></html>
