<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face { font-family: 'Noto Malayalam'; font-weight: 800; src: url(/pipeline/fonts/noto-sans-malayalam-malayalam-800-normal.woff2); }
@font-face { font-family: 'Oswald'; font-weight: 700; src: url(/pipeline/fonts/oswald-latin-700-normal.woff2); }
html,body{margin:0}</style></head><body><canvas id=c width=2500 height=1500></canvas><script type="module">
await document.fonts.load("800 40px 'Noto Malayalam'"); await document.fonts.load("700 40px 'Oswald'");
const B = await import('/pipeline/bean.js'); (await import('/episodes/ml-colachel/cast.js')).registerCast(B); (await import('/episodes/ml-kunjali/cast.js')).registerCast(B);
const { drawBean, CAST, PROPS } = B;
const c = document.getElementById('c'), x = c.getContext('2d'); const g = x.createLinearGradient(0, 0, 0, 1500); g.addColorStop(0, '#173a5a'); g.addColorStop(1, '#0c1a2a'); x.fillStyle = g; x.fillRect(0, 0, 2500, 1500);
x.fillStyle = '#f0c23a'; x.textAlign = 'center'; x.font = "700 46px 'Oswald'"; x.fillText('KUNJALI MARAKKAR: CAST', 1250, 1484);
const row1 = [['kunjali', { expr: 'proud', R: 'holdUp', propR: PROPS.scimitar, L: 'hip' }], ['kunjali3', { expr: 'smile', R: 'point', L: 'hold', propL: PROPS.telescope }], ['zamorin', { expr: 'smug', R: 'hold', propR: PROPS.treaty, L: 'hip' }], ['sailor', { expr: 'grin', R: 'hold', propR: PROPS.oarK, L: 'fist' }], ['sailor2', { expr: 'beam', R: 'up', L: 'hold', propL: PROPS.rope }]];
const row2 = [['captain', { expr: 'laugh', R: 'holdUp', propR: PROPS.telescope, L: 'hip' }], ['viceroy', { expr: 'sly', R: 'hold', propR: PROPS.treaty, L: 'hip' }], ['portSoldier', { expr: 'stern', R: 'rifle', propR: PROPS.musket }], ['kunjaliChained', { expr: 'sad', R: 'hang', L: 'hang' }], ['navy', { expr: 'proud', R: 'wave', L: 'hang' }]];
const put = (row, y) => row.forEach(([k, o], i) => { const cx = 250 + i * 500; x.fillStyle = 'rgba(255,210,120,.12)'; x.beginPath(); x.ellipse(cx, y - 260, 210, 330, 0, 0, 7); x.fill(); x.save(); x.translate(cx, y); x.scale(1.4, 1.4); drawBean(x, k, o); x.restore(); x.font = "700 30px 'Oswald'"; x.fillStyle = '#f6efe0'; x.fillText(CAST[k].name.toUpperCase(), cx, y + 46); });
put(row1, 680); put(row2, 1380);
window.png = c.toDataURL('image/png'); window.done = true;
</script></body></html>
