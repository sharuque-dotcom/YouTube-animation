<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face { font-family: 'Noto Malayalam'; font-weight: 800; src: url(/pipeline/fonts/noto-sans-malayalam-malayalam-800-normal.woff2); }
@font-face { font-family: 'Oswald'; font-weight: 700; src: url(/pipeline/fonts/oswald-latin-700-normal.woff2); }
html,body{margin:0}</style></head><body><canvas id=c width=2000 height=1500></canvas><script type="module">
await document.fonts.load("800 40px 'Noto Malayalam'"); await document.fonts.load("700 40px 'Oswald'");
const B = await import('/pipeline/bean.js'); const { registerCast } = await import('/episodes/ml-gulf/cast.js'); registerCast(B);
const { drawBean, CAST, PROPS } = B;
const c = document.getElementById('c'), x = c.getContext('2d'); x.fillStyle = '#f2d78a'; x.fillRect(0, 0, 2000, 1500);
x.fillStyle = '#2a1c17'; x.textAlign = 'center'; x.font = "700 46px 'Oswald'"; x.fillText('GULF BOOM: NEW CAST', 1000, 70);
const row1 = [['dasan', { expr: 'beam', R: 'holdUp', propR: PROPS.bundle, L: 'wave' }], ['vijayan', { expr: 'nervous', R: 'hold', propR: PROPS.suitcase, L: 'mouth' }], ['manavalan', { expr: 'smug', R: 'holdUp', propR: PROPS.twoinone, L: 'hip' }], ['boatman', { expr: 'sly', R: 'point', L: 'hip' }]];
const row2 = [['worker', { expr: 'proud', R: 'holdUp', propR: PROPS.letter, L: 'hip' }], ['amma', { expr: 'beam', R: 'holdUp', propR: PROPS.draft, L: 'wave' }], ['youth', { expr: 'nervous', R: 'holdUp', propR: PROPS.papers, L: 'chin' }], ['clerk', { expr: 'smug', R: 'point', L: 'hip' }]];
const put = (row, y) => row.forEach(([k, o], i) => { const cx = 250 + i * 500; x.save(); x.translate(cx, y); x.scale(1.4, 1.4); drawBean(x, k, o); x.restore(); x.font = "700 30px 'Oswald'"; x.fillStyle = '#2a1c17'; x.fillText(CAST[k].name.toUpperCase(), cx, y + 50); });
put(row1, 660); put(row2, 1400);
window.png = c.toDataURL('image/png'); window.done = true;
</script></body></html>
