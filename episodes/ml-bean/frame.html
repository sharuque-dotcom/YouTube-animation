<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face { font-family: 'Noto Malayalam'; font-weight: 800; src: url(/pipeline/fonts/noto-sans-malayalam-malayalam-800-normal.woff2); }
@font-face { font-family: 'Noto Malayalam'; font-weight: 600; src: url(/pipeline/fonts/noto-sans-malayalam-malayalam-600-normal.woff2); }
@font-face { font-family: 'Oswald'; font-weight: 700; src: url(/pipeline/fonts/oswald-latin-700-normal.woff2); }
@font-face { font-family: 'Oswald'; font-weight: 800; src: url(/pipeline/fonts/oswald-latin-700-normal.woff2); }
html,body{margin:0;background:#000}</style>
<script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }</script>
</head><body><script type="module">
const q = new URLSearchParams(location.search);
await document.fonts.load("800 40px 'Noto Malayalam'"); await document.fonts.load("700 40px 'Oswald'");
const { THREE, makeInkStage } = await import('/pipeline/toon3d.js');
const { buildStreet, radioCrowd } = await import('/episodes/ml-bean/street.js');
const W = +(q.get('w') || 1080), H = +(q.get('h') || 1920), t = +(q.get('t') || 1.3);
const S = buildStreet(); const cards = radioCrowd(S.scene);
const cam = new THREE.PerspectiveCamera(+(q.get('fov') || 52), W / H, 0.1, 300);
const cp = (q.get('cam') || '1.3,1.85,5.4').split(',').map(Number), la = (q.get('look') || '-1.9,1.5,-0.4').split(',').map(Number);
cam.position.set(...cp); cam.lookAt(...la); cam.rotateZ(+(q.get('roll') || 0.02));
S.life.forEach((f) => f(t));
const stage = makeInkStage(W, H);
stage.render(S.scene, cam, { focus: +(q.get('focus') || 4.6), aperture: +(q.get('ap') || 10), hazeAmt: 0.35 });
window.png = stage.canvas.toDataURL('image/png'); window.done = true;
</script></body></html>
